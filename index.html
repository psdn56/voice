<!DOCTYPE html>
<html>
<head>
    <title>Voice Cloning App</title>
</head>
<body>

<h2>🎙️ My AI Voice Clone</h2>

<form method="POST">
    <textarea name="text" rows="6" cols="40"></textarea><br><br>
    <button type="submit">Generate Voice</button>
</form>

{% if audio %}
    <h3>Output:</h3>
    <audio controls>
        <source src="/audio" type="audio/wav">
    </audio>
    <br>
    <a href="/audio" download>Download</a>
{% endif %}

</body>
</html>
